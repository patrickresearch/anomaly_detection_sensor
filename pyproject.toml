[project]
name = "anomaly-detection-sensor"
version = "0.1.0"
description = "Comparing anomaly detectors on labeled sensor time series from the Numenta Anomaly Benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "stumpy>=1.13",
    "torch>=2.5",
    "plotly>=5.24",
    "kaleido>=1.0",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
